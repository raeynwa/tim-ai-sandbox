<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Pekerjaan Tim — Pilot 5E</title>
<style>:root{font:16px/1.6 system-ui;color:#183044;background:#f1f5f8}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:auto;padding:32px 20px}h1{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:8px 0}header p{color:#4b6273}section{background:white;border:1px solid #ccd8e0;border-radius:14px;padding:24px;margin:24px 0}label{display:block;font-weight:600}input,select,button{font:inherit;min-height:44px;padding:10px 12px;border:1px solid #8296a5;border-radius:7px;max-width:100%}input{width:100%}button{background:#164f70;color:white;cursor:pointer;font-weight:600}button:hover{background:#103d57}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid #bc6700;outline-offset:3px}.fields{display:grid;grid-template-columns:1fr 160px auto;gap:16px;align-items:end}.hint{font-size:14px;color:#4b6273}#feedback{min-height:26px;font-weight:600}#feedback[data-error=true]{color:#9d2020}ul{list-style:none;padding:0}li{display:flex;gap:20px;align-items:center;justify-content:space-between;border-top:1px solid #d7e1e8;padding:18px 0}.task-title{font-weight:650;overflow-wrap:anywhere}.meta{font-size:14px;color:#4b6273}li>div{min-width:0}li select{flex-shrink:0;max-width:48%}.eyebrow{font-size:13px;letter-spacing:.1em;font-weight:700;color:#164f70}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:20px;margin:0}@media(max-width:600px){main{padding:24px 14px}section{padding:18px}.fields{grid-template-columns:1fr}li{align-items:start;flex-direction:column}li select{max-width:100%;width:100%}}</style>
<main><header><div class="eyebrow">BLACKPEARL OFFICE · PILOT 5E</div><h1>Daftar pekerjaan tim</h1><p>Catat pekerjaan, tentukan prioritas, dan pantau progres tim.</p></header><section aria-labelledby="add-heading"><h2 id="add-heading">Tambah pekerjaan</h2><p class="hint">Judul wajib diisi, maksimal 120 karakter.</p><form id="task-form"><div class="fields"><div><label for="title">Judul pekerjaan</label><input id="title" name="title" required maxlength="120" autocomplete="off" aria-describedby="feedback"></div><div><label for="priority">Prioritas</label><select id="priority"><option value="low">Rendah</option><option value="medium" selected>Sedang</option><option value="high">Tinggi</option></select></div><button id="submit">Tambah tugas</button></div></form><p id="feedback" role="status" aria-live="polite"></p></section><section aria-labelledby="list-heading"><div class="row"><h2 id="list-heading">Pekerjaan tersimpan</h2><button id="refresh" type="button">Muat ulang</button></div><p id="empty">Memuat pekerjaan…</p><ul id="tasks"></ul></section><footer class="hint">Lingkungan uji UAT · Gunakan data percobaan.</footer></main><script src="/app.js" defer></script></html>
